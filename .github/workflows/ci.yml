name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Install, Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pulserank_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval db.adminCommand('ping')"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @pulserank/shared build

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/pulserank_test
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Build API
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/pulserank_test
          MONGODB_URI: mongodb://localhost:27017/pulserank_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: pnpm build

      - name: Build Web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm build

      - name: Run API unit tests
        working-directory: apps/api
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/pulserank_test
          MONGODB_URI: mongodb://localhost:27017/pulserank_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: pnpm test --passWithNoTests

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 7
